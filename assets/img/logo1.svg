<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 150" width="100%" height="100%">
  <!-- Definition for rounded font styling and drop shadow to match the 3D sticker look -->
  <defs>
    <style>
      .brand-title {
        font-family: 'Fredoka', 'Quicksand', 'Nunito', 'Segoe UI', sans-serif;
        font-weight: 900;
        font-size: 52px;
        letter-spacing: 1px;
      }
      .orange-text { fill: #FF9F1C; }
      .blue-text { fill: #4EA8DE; }
      .outline {
        stroke: #2D3142;
        stroke-width: 4px;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
    </style>
    <!-- Soft shadow behind the bunny and text -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2D3142" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- ==================== 1. RABBIT ILLUSTRATION ==================== -->
    <g transform="translate(295, 12)">
      <!-- Outer Ears -->
      <ellipse cx="-18" cy="35" rx="10" ry="28" fill="#E9C46A" class="outline" transform="rotate(-12, -18, 35)" />
      <ellipse cx="18" cy="35" rx="10" ry="28" fill="#E9C46A" class="outline" transform="rotate(12, 18, 35)" />
      
      <!-- Inner Ears (Pink) -->
      <ellipse cx="-18" cy="35" rx="5" ry="18" fill="#F4A261" transform="rotate(-12, -18, 35)" />
      <ellipse cx="18" cy="35" rx="5" ry="18" fill="#F4A261" transform="rotate(12, 18, 35)" />
      
      <!-- Head -->
      <ellipse cx="0" cy="65" rx="26" ry="22" fill="#E9C46A" class="outline" />
      
      <!-- Cheeks (Blush) -->
      <circle cx="-14" cy="70" r="5" fill="#F4A261" opacity="0.6" />
      <circle cx="14" cy="70" r="5" fill="#F4A261" opacity="0.6" />

      <!-- Eyes -->
      <circle cx="-10" cy="62" r="3" fill="#2D3142" />
      <circle cx="10" cy="62" r="3" fill="#2D3142" />
      
      <!-- Nose & Mouth Snout -->
      <path d="M -3 67 Q 0 64 3 67 Q 0 69 -3 67" fill="#F4A261" />
      <path d="M 0 67 L 0 71 Q -3 73 -5 71 M 0 71 Q 3 73 5 71" fill="none" stroke="#2D3142" stroke-width="2" stroke-linecap="round" />

      <!-- Open Book the Bunny is holding -->
      <g transform="translate(0, 80)">
        <!-- Book Pages -->
        <path d="M -22 0 Q -11 -4 0 4 Q 11 -4 22 0 L 20 14 Q 10 10 0 16 Q -10 10 -20 14 Z" fill="#FFFDF9" class="outline" />
        <!-- Book Spine/Cover background (Sky Blue) -->
        <path d="M -22 3 Q -11 -1 0 7 Q 11 -1 22 3" fill="none" stroke="#4EA8DE" stroke-width="3" />
      </g>
    </g>

    <!-- ==================== 2. BRAND NAME TEXT ==================== -->
    <g transform="translate(325, 122)" text-anchor="middle">
      <!-- Background shadow/border effect for "READING RABBIT" -->
      <text class="brand-title outline" x="0" y="0">
        <tspan class="orange-text">READING</tspan> <tspan class="blue-text">RABBIT</tspan>
      </text>
      <text class="brand-title" x="0" y="0">
        <tspan class="orange-text">READING</tspan> <tspan class="blue-text">RABBIT</tspan>
      </text>
    </g>
  </g>
</svg>
